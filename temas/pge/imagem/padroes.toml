# Padrões de imagem da PGE-MS, lidos por ./ap imagens (contrato em docs/temas.md, seção Imagem).
# O imagens.toml do deck só escreve o que foge daqui.

# Só o gemini, o padrão e o único com preço na tabela de ferramentas/imagens.py. Outro gerador entra aqui só se o
# usuário pedir, com a data.
geradores = ["gemini"]

# Tratamento por papel, com os valores da co.juris como ponto de partida (tema claro, fundo azul quase branco);
# confira nos stills do primeiro deck e ajuste aqui.

[tratamento.heroica]   # tela cheia sob o véu marinho
tom = "duotone"
intensidade = 0.8
largura = 2048

[tratamento.objeto]    # recortado sobre o fundo claro; gama 1,8 escurece os meios-tons para o papel não sumir
tom = "duotone"
intensidade = 0.8
largura = 900
alfa = true
gama = 1.8

[tratamento.textura]   # fundo de seção, sem recorte
tom = "duotone"
intensidade = 0.8
largura = 2048
