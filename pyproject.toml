[project]
name = "apresentacao"
version = "0.1.0"
description = "Apresentações ao vivo feitas por código: motor de palco, temas, pontes de imagem e vídeo com IA"
requires-python = ">=3.12,<3.13"
dependencies = [
    "playwright>=1.50",
    "pillow>=10.0",
    "numpy>=1.26",
    "requests>=2.31",   # empacotar baixa Google Fonts quando o deck usa
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
